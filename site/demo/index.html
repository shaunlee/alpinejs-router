<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live demo · alpinejs-router</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Schibsted Grotesk"; src: url("../fonts/schibsted-grotesk-latin-var.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url("../fonts/jetbrains-mono-latin-var.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column;
  background: #f4f1e8; color: #14213d;
  font-family: "Schibsted Grotesk", system-ui, sans-serif; font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
[x-cloak] { display: none !important; }
code, pre { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid #256b78; outline-offset: 2px; }
nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1.5px solid #14213d; }
nav a { padding: 5px 12px; border: 1.5px solid transparent; border-radius: 4px; font-size: 15px; font-weight: 600; color: #256b78; }
nav a:hover { border-color: #14213d; }
nav a.active { text-decoration: underline; text-underline-offset: 4px; }
nav a.exact-active { color: #14213d; background: #f2c200; border-color: #14213d; text-decoration: none; }
main { flex: 1; padding: 20px 22px; }
h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; }
p { margin: 0; color: #4f5768; font-size: 15.5px; }
p + p { margin-top: 6px; }
p code { font-size: 13.5px; color: #14213d; border: 1px solid rgba(20,33,61,.45); border-radius: 3px; padding: 0 4px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.row a, .row button {
  font: inherit; font-size: 14px; font-weight: 600; color: #14213d; background: none; cursor: pointer;
  border: 1.5px solid #14213d; border-radius: 4px; padding: 5px 12px;
}
.row a:hover, .row button:hover { background: rgba(20,33,61,.07); }
.loading { color: #256b78; font-size: 15px; }
.notice { margin: 16px 22px 0; padding: 12px 14px; border: 1.5px solid #14213d; border-radius: 4px; background: #f7e7a1; font-size: 14.5px; }
.notice code { font-size: 13px; }
.state { display: grid; grid-template-columns: auto 1fr 1fr; margin: 0; border-top: 1.5px solid #14213d; font-size: 13px; line-height: 1.4; }
.state > span { padding: 10px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state > span + span { border-left: 1.5px solid #14213d; }
.state b { color: #256b78; font-weight: 600; margin-right: 8px; }
@media (max-width: 480px) { .state { grid-template-columns: 1fr; } .state > span + span { border-left: 0; border-top: 1px solid #cfc8b6; } }
</style>
</head>
<body x-data x-init="$router.config({ mode: 'hash', base: location.pathname })"
      x-effect="$router.path, $router.query, parent.postMessage({ demo: 'alpinejs-router', url: location.hash || '#/' }, location.protocol === 'file:' ? '*' : location.origin)">

<nav>
  <a x-link.activity href="/">Home</a>
  <a x-link.activity href="/hello/alpine">Hello</a>
  <a x-link.activity href="/users/42">User 42</a>
  <a x-link.activity href="/search?q=router">Search</a>
  <a x-link.activity href="/about">About</a>
  <a x-link.activity href="/nowhere">Missing</a>
</nav>

<main>
  <template x-route="/">
    <section>
      <h1>Home</h1>
      <p>Every link above is an <code>&lt;a x-link&gt;</code>. Each page is a <code>&lt;template x-route&gt;</code>. Watch the address bar and the state below.</p>
    </section>
  </template>

  <template x-route="/hello/:name">
    <section>
      <h1>Hello, <span x-text="$router.params.name"></span></h1>
      <p>Matched <code>/hello/:name</code>. The param is in <code>$router.params.name</code>.</p>
      <div class="row">
        <a x-link href="/hello/world">/hello/world</a>
        <button type="button" @click="$router.replace('/hello/replaced')">$router.replace(…)</button>
      </div>
    </section>
  </template>

  <template x-route="/users/:id(\d+)">
    <section>
      <h1>User #<span x-text="$router.params.id"></span></h1>
      <p>The route is <code>/users/:id(\d+)</code>, so only digits match.</p>
      <div class="row">
        <a x-link href="/users/7">/users/7</a>
        <a x-link href="/users/abc">/users/abc</a>
      </div>
    </section>
  </template>

  <template x-route="/search">
    <section>
      <h1>Search: <span x-text="$router.query.q"></span></h1>
      <p>Page <code x-text="$router.query.page ?? 1"></code>. The links below come from <code>$router.resolve({ page })</code>.</p>
      <div class="row">
        <a x-link :href="$router.resolve({ page: 1 })">page 1</a>
        <a x-link :href="$router.resolve({ page: 2 })">page 2</a>
        <a x-link :href="$router.resolve({ page: 3 })">page 3</a>
      </div>
    </section>
  </template>

  <template x-route="/about" template="./about.html"></template>

  <template x-route.notfound>
    <section>
      <h1>Not found</h1>
      <p>No route matched <code x-text="$router.path"></code>, so <code>x-route.notfound</code> rendered.</p>
    </section>
  </template>

  <p class="loading" x-show="$router.loading" x-cloak>Loading template…</p>
</main>

<div class="state" aria-live="polite">
  <span><b>path</b><code x-text="$router.path"></code></span>
  <span><b>params</b><code x-text="JSON.stringify($router.params)"></code></span>
  <span><b>query</b><code x-text="JSON.stringify($router.query)"></code></span>
</div>

<p class="notice" id="file-notice" hidden>Opened from disk, so the browser blocks <code>about.html</code> and some navigation. Serve the folder over http to try every route, for example <code>python3 -m http.server -d site</code>.</p>

<script>
// The Pages workflow copies router.min.js (this commit's build) and
// alpine.min.js next to this file. A local preview of site/ has neither, so
// fall back to the published builds on unpkg. The router has to run before
// Alpine starts, so load them one after the other.
(() => {
  const load = (src, fallback) => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => fallback ? load(fallback).then(resolve, reject) : reject(new Error('Cannot load ' + src));
    document.body.append(s);
  });
  if (location.protocol === 'file:') document.getElementById('file-notice').hidden = false;
  load('router.min.js', 'https://unpkg.com/@shaun/alpinejs-router@1/dist/cdn.min.js')
    .then(() => load('alpine.min.js', 'https://unpkg.com/alpinejs@3/dist/cdn.min.js'))
    .catch(error => console.error(error));
})();
</script>
</body>
</html>
