<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="alpinejs-router: routes in your HTML, for Alpine.js">
  <style>
    @font-face { font-family: "SG"; src: url("../../site/fonts/schibsted-grotesk-latin-var.woff2"); font-weight: 400 900; }
    @font-face { font-family: "JBM"; src: url("../../site/fonts/jetbrains-mono-latin-var.woff2"); font-weight: 100 800; }
    .sans { font-family: "SG", sans-serif; } .mono { font-family: "JBM", monospace; }
  </style>
  <rect width="1280" height="640" fill="#F4F1E8"/>
  <image href="../../site/contours.svg" x="640" y="-60" width="760" height="600" opacity="1"/>

  <text x="80" y="126" class="sans" font-size="34" font-weight="750" fill="#14213D" letter-spacing="-0.6">alpinejs-router</text>
  <text x="1200" y="124" text-anchor="end" class="sans" font-size="20" font-weight="700" letter-spacing="2" fill="#256B78">MIT · ALPINE.JS 3 PLUGIN</text>
  <line x1="80" y1="160" x2="1200" y2="160" stroke="#14213D" stroke-width="2"/>

  <text x="80" y="268" class="sans" font-size="78" font-weight="800" fill="#14213D" letter-spacing="-2.6">Routes in your HTML.</text>
  <text x="80" y="352" class="sans" font-size="78" font-weight="800" fill="#14213D" letter-spacing="-2.6">Alpine renders them.</text>

  <g transform="translate(944 205)" class="mono" font-size="18" font-weight="600">
    <path d="M120 230V40" stroke="#14213D" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 52H-36l-16 17 16 17h156z" fill="#F2C200" stroke="#14213D" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M120 100h116l16 17-16 17H120z" fill="#F2C200" stroke="#14213D" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="-28" y="75" fill="#14213D">/hello/alpine</text>
    <text x="132" y="123" fill="#14213D">/users/42</text>
    <circle cx="120" cy="225" r="9" fill="#D7263D" stroke="#14213D" stroke-width="2.4"/>
  </g>

  <line x1="80" y1="430" x2="1200" y2="430" stroke="#14213D" stroke-width="2"/>
  <line x1="400" y1="430" x2="400" y2="560" stroke="#14213D" stroke-width="2"/>
  <line x1="760" y1="430" x2="760" y2="560" stroke="#14213D" stroke-width="2"/>
  <g class="sans" fill="#14213D">
    <text x="80" y="505" font-size="58" font-weight="800" letter-spacing="-1.8">3.2 kB</text>
    <text x="80" y="545" font-size="22" fill="#4F5768">minified and gzipped</text>
    <text x="430" y="505" font-size="58" font-weight="800" letter-spacing="-1.8">6.25M</text>
    <text x="430" y="545" font-size="22" fill="#4F5768">static route matches a second</text>
    <text x="790" y="505" font-size="58" font-weight="800" letter-spacing="-1.8">0</text>
    <text x="790" y="545" font-size="22" fill="#4F5768">dependencies besides Alpine.js</text>
  </g>
  <text x="1200" y="606" text-anchor="end" class="mono" font-size="18" fill="#4F5768">npm install @shaun/alpinejs-router</text>
</svg>
